<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 600 400" width="600" height="400" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,1 L6,3.5 L0,6 Z" fill="#003B73"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,1 L6,3.5 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="18" width="600" height="400" rx="8" fill="#FFFFFF"/>

  <!-- ================= STAGE 1 ================= -->
  <rect x="20" y="28" width="560" height="108" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="20" y="28" width="560" height="26" rx="6" fill="#003B73"/>
  <text x="32" y="45" font-size="11" font-weight="700" fill="#FFFFFF">STAGE 01 • VACUUM INJECTION CASTING OF U-10wt%Zr SLUGS</text>
  <text x="568" y="45" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="end">NUREG/CR-7305 Spec</text>

  <!-- Step 1A -->
  <rect x="30" y="62" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="38" y="80" font-size="10.8" font-weight="700" fill="#003B73">1A. VIM Alloy Melting</text>
  <text x="38" y="97" font-size="10" fill="#334155">U + 10 wt% Zr (≥99.9% pure)</text>
  <text x="38" y="113" font-size="10" fill="#475569">Vacuum &lt; 200 μm Hg / Ar</text>

  <line x1="198" y1="94" x2="213" y2="94" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Step 1B -->
  <rect x="217" y="62" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="225" y="80" font-size="10.8" font-weight="700" fill="#003B73">1B. Quartz-Mold Cast</text>
  <text x="225" y="97" font-size="10" fill="#334155">Pressurized melt injection</text>
  <text x="225" y="113" font-size="10" font-weight="600" fill="#003B73">ZrO₂-coated silica molds</text>

  <line x1="385" y1="94" x2="400" y2="94" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Step 1C -->
  <rect x="404" y="62" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="412" y="80" font-size="10.8" font-weight="700" fill="#003B73">1C. Demold &amp; Slug QA</text>
  <text x="412" y="97" font-size="10" fill="#334155">Shear to length &amp; weight</text>
  <text x="412" y="113" font-size="10" font-weight="600" fill="#334155">+0.3 / −0.5 g/cm³ density</text>

  <!-- Connector 1 -> 2 -->
  <line x1="300" y1="136" x2="300" y2="158" stroke="#003B73" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- ================= STAGE 2 ================= -->
  <rect x="20" y="162" width="560" height="108" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="20" y="162" width="560" height="26" rx="6" fill="#D97706"/>
  <text x="32" y="179" font-size="11" font-weight="700" fill="#FFFFFF">STAGE 02 • PIN LOADING, END-CAP JOINING &amp; THERMAL Na-BONDING</text>
  <text x="568" y="179" font-size="10" font-weight="600" fill="#FEF3C7" text-anchor="end">75% Smear Density</text>

  <!-- Step 2A -->
  <rect x="30" y="196" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="38" y="214" font-size="10.8" font-weight="700" fill="#B45309">2A. HT9 &amp; Na Loading</text>
  <text x="38" y="231" font-size="10" fill="#334155">Norm. 1050 °C / Temp. 750 °C</text>
  <text x="38" y="247" font-size="10" font-weight="600" fill="#B45309">Purified Na (O ≤ 100 ppm)</text>

  <line x1="198" y1="228" x2="213" y2="228" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Step 2B -->
  <rect x="217" y="196" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="225" y="214" font-size="10.8" font-weight="700" fill="#B45309">2B. He Fill &amp; End-Weld</text>
  <text x="225" y="231" font-size="10" fill="#334155">1.4× He plenum backfill</text>
  <text x="225" y="247" font-size="10" font-weight="600" fill="#B45309">GTAW/TIG (PRW for ODS)</text>

  <line x1="385" y1="228" x2="400" y2="228" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Step 2C -->
  <rect x="404" y="196" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="412" y="214" font-size="10.8" font-weight="700" fill="#B45309">2C. 500 °C Bond &amp; PWHT</text>
  <text x="412" y="231" font-size="10" fill="#334155">Thermal/impact Na wetting</text>
  <text x="412" y="247" font-size="10" font-weight="700" fill="#C2410C">~750 °C PWHT tempers HAZ</text>

  <!-- Connector 2 -> 3 -->
  <line x1="300" y1="270" x2="300" y2="292" stroke="#003B73" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- ================= STAGE 3 ================= -->
  <rect x="20" y="296" width="560" height="108" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="20" y="296" width="560" height="26" rx="6" fill="#15803D"/>
  <text x="32" y="313" font-size="11" font-weight="700" fill="#FFFFFF">STAGE 03 • NON-DESTRUCTIVE BOND &amp; CLOSURE QUALIFICATION</text>
  <text x="568" y="313" font-size="10" font-weight="600" fill="#DCFCE7" text-anchor="end">100% Pin Inspection</text>

  <!-- Step 3A -->
  <rect x="30" y="330" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="38" y="348" font-size="10.8" font-weight="700" fill="#166534">3A. Eddy-Current / UT</text>
  <text x="38" y="365" font-size="10" fill="#334155">Scans annular Na bond gap</text>
  <text x="38" y="381" font-size="10" font-weight="600" fill="#166534">Rejects unbonded voids</text>

  <line x1="198" y1="362" x2="213" y2="362" stroke="#15803D" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Step 3B -->
  <rect x="217" y="330" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="225" y="348" font-size="10.8" font-weight="700" fill="#166534">3B. X-Ray Radiography</text>
  <text x="225" y="365" font-size="10" fill="#334155">Verifies Na level meniscus</text>
  <text x="225" y="381" font-size="10" font-weight="600" fill="#334155">&amp; end-plug weld soundness</text>

  <line x1="385" y1="362" x2="400" y2="362" stroke="#15803D" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Step 3C -->
  <rect x="404" y="330" width="166" height="64" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="412" y="348" font-size="10.8" font-weight="700" fill="#166534">3C. He Leak &amp; Wire-Wrap</text>
  <text x="412" y="365" font-size="10" fill="#334155">Mass-spec He leak check</text>
  <text x="412" y="381" font-size="10" font-weight="600" fill="#166534">Spiral HT9 spacer attachment</text>
</svg>
