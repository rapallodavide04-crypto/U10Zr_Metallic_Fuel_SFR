<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#003B73"/>
    </marker>
    <marker id="arrowDark" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,1 L6,3.5 L0,6 Z" fill="#334155"/>
    </marker>
    <pattern id="slugHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="640" height="420" rx="8" fill="#FFFFFF"/>

  <!-- Section 1: Longitudinal View -->
  <text x="20" y="26" font-size="13" font-weight="700" fill="#003B73" letter-spacing="0.3">LONGITUDINAL SECTION (SCHEMATIC — NOT TO SCALE)</text>

  <!-- Wire-wrap helix behind/around pin -->
  <path d="M72,72 Q115,62 158,72 T244,72 T330,72 T416,72 T502,72 T568,72" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Outer HT9 Cladding Tube -->
  <rect x="60" y="72" width="520" height="56" rx="4" fill="#CBD5E1" stroke="#334155" stroke-width="2"/>
  <!-- Bottom End-Plug -->
  <rect x="60" y="72" width="24" height="56" rx="3" fill="#475569" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Top End-Plug -->
  <rect x="556" y="72" width="24" height="56" rx="3" fill="#475569" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Inner cavity -->
  <rect x="84" y="79" width="472" height="42" fill="#F1F5F9"/>

  <!-- Liquid Na Bond (covers fuel slug + meniscus above slug) -->
  <rect x="84" y="79" width="202" height="42" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>

  <!-- U-10Zr Fuel Slug -->
  <rect x="88" y="85" width="185" height="30" rx="2" fill="#1E3A8A" fill-opacity="0.82" stroke="#0B2545" stroke-width="1.2"/>
  <rect x="88" y="85" width="185" height="30" rx="2" fill="url(#slugHatch)"/>
  <text x="180" y="104" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">U-10wt%Zr Fuel Slug</text>

  <!-- Fission Gas Plenum (1.4x fuel slug length: 270 vs 185) -->
  <rect x="286" y="79" width="270" height="42" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="421" y="98" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">Fission Gas Plenum</text>
  <text x="421" y="113" font-size="10.5" font-weight="600" fill="#003B73" text-anchor="middle">1.4× fuel volume</text>

  <!-- Longitudinal Callouts -->
  <text x="72" y="148" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">HT9 End-Plug</text>
  <text x="568" y="148" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">HT9 End-Plug</text>

  <path d="M312,146 L280,146 L280,112" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <text x="320" y="160" font-size="11" font-weight="700" fill="#C2410C" text-anchor="middle">Liquid Na Bond (75% smear density)</text>

  <line x1="150" y1="145" x2="150" y2="125" stroke="#334155" stroke-width="1.2" marker-end="url(#arrowDark)"/>
  <text x="150" y="160" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">HT9 Cladding Tube</text>

  <line x1="459" y1="53" x2="459" y2="67" stroke="#475569" stroke-width="1.2" marker-end="url(#arrowDark)"/>
  <text x="459" y="48" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">Helical Wire-Wrap</text>

  <!-- Divider -->
  <line x1="20" y1="184" x2="620" y2="184" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Section 2: Radial Cross-Section -->
  <text x="20" y="203" font-size="13" font-weight="700" fill="#003B73" letter-spacing="0.3">RADIAL CROSS-SECTION (NUREG/CR-7305 REFERENCE)</text>

  <!-- Cross section centered at (210, 308) -->
  <!-- HT9 Cladding Outer Circle (R = 76) -->
  <circle cx="210" cy="308" r="76" fill="#CBD5E1" stroke="#334155" stroke-width="2.2"/>
  <!-- Liquid Na Bond Gap (R = 63) -->
  <circle cx="210" cy="308" r="63" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <!-- U-10Zr Fuel Slug (R = 50) -->
  <circle cx="210" cy="308" r="50" fill="#1E3A8A" fill-opacity="0.85" stroke="#0B2545" stroke-width="1.5"/>
  <circle cx="210" cy="308" r="50" fill="url(#slugHatch)"/>
  <text x="210" y="305" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">U-10Zr</text>
  <text x="210" y="320" font-size="10.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Slug</text>

  <!-- Helical Wire-Wrap on top-left of cladding -->
  <circle cx="275" cy="252" r="10" fill="#94A3B8" stroke="#334155" stroke-width="1.6"/>

  <!-- Dimension Callouts (Right Side of Cross-Section) -->
  <!-- Fuel OD 5.0 mm -->
  <line x1="252" y1="282" x2="340" y2="248" stroke="#003B73" stroke-width="1.4"/>
  <circle cx="252" cy="282" r="2.5" fill="#003B73"/>
  <rect x="342" y="232" width="272" height="32" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="352" y="252" font-size="11.5" font-weight="700" fill="#003B73">U-10Zr Fuel Slug: OD = 5.0 mm</text>

  <!-- Na Bond 75% smear -->
  <line x1="266" y1="308" x2="340" y2="294" stroke="#D97706" stroke-width="1.4"/>
  <circle cx="266" cy="308" r="2.5" fill="#D97706"/>
  <rect x="342" y="276" width="272" height="32" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="352" y="296" font-size="11.5" font-weight="700" fill="#C2410C">Liquid Na Bond: 75% smear density</text>

  <!-- HT9 Cladding OD 6.9 mm / wall 0.6 mm -->
  <line x1="278" y1="336" x2="340" y2="340" stroke="#334155" stroke-width="1.4"/>
  <circle cx="278" cy="336" r="2.5" fill="#334155"/>
  <rect x="342" y="320" width="272" height="44" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="352" y="339" font-size="11.5" font-weight="700" fill="#1E293B">HT9 Cladding: OD = 6.9 mm</text>
  <text x="352" y="355" font-size="11" font-weight="600" fill="#475569">Wall thickness = 0.6 mm (PICT &lt; 650 °C)</text>

  <!-- Wire-Wrap Label -->
  <line x1="283" y1="245" x2="322" y2="220" stroke="#475569" stroke-width="1.2"/>
  <text x="326" y="222" font-size="10.5" font-weight="600" fill="#475569">Helical Wire-Wrap Spacer</text>

  <!-- Outer Diameter Span Indicator on Left -->
  <line x1="118" y1="232" x2="118" y2="384" stroke="#334155" stroke-width="1.2"/>
  <line x1="112" y1="232" x2="134" y2="232" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="112" y1="384" x2="134" y2="384" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="38" y="295" width="74" height="26" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="75" y="312" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">Ø 6.9 mm</text>
</svg>
